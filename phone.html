<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Đua Xe Ôm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Bungee&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #1d1a16; color: #fff; font-family: 'Baloo 2', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; overscroll-behavior: none; }
  .screen { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 20px; text-align: center; }
  [hidden] { display: none !important; }
  h1, #rank, #tap, #win .place { font-family: Bungee, 'Baloo 2', sans-serif; font-weight: 400; }
  h1 { font-size: 2.8rem; margin: 0; line-height: 1.1; }
  .logo { width: 1.5em; height: 1.15em; object-fit: contain; vertical-align: middle; }
  input, button { font: inherit; border: 0; border-radius: 14px; }
  input { width: 100%; max-width: 360px; padding: 18px 16px; font-size: 1.6rem; text-align: center; }
  form button { width: 100%; max-width: 360px; padding: 18px 32px; background: #e8590c; color: #fff; font-size: 1.6rem; font-weight: 800; box-shadow: 0 6px 0 #a63e08; }
  form button:disabled { opacity: .4; }
  #status { font-size: 1.7rem; font-weight: 800; line-height: 1.2; padding: 10px 16px; border-radius: 16px; background: #0006; }
  #status:empty { display: none; }
  /* nửa trên: đường đua + hạng, nửa dưới: nút tap to hết cỡ */
  #game { justify-content: stretch; align-items: stretch; gap: 12px; padding: 12px 12px max(16px, env(safe-area-inset-bottom)); }
  #view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #hud { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  #rank { font-size: 3.6rem; font-weight: 900; line-height: 1; }
  #rank small { font-size: 1.6rem; color: #fff9; }
  #track { flex: 1; min-height: 0; width: 100%; border-radius: 14px; background: #0004; }
  #tap { flex: 1.2; min-height: 0; width: 100%; border-radius: 28px; background: #e8590c; color: #fff;
    font-size: 3.6rem; font-weight: 900; line-height: 1.1; box-shadow: 0 10px 0 #a63e08; transition: transform .05s; }
  #tap img { display: block; width: 40%; height: auto; max-height: 40%; object-fit: contain; margin: 0 auto 8px; pointer-events: none; }
  #tap.hit { transform: translateY(6px) scale(.97); box-shadow: 0 4px 0 #a63e08; }
  #tap.off { background: #555; box-shadow: 0 10px 0 #333; }
  #tap.off { font-size: 2.4rem; }
  #tap.stun { background: #c92a2a; box-shadow: 0 10px 0 #7d1a1a; font-size: 2.6rem; animation: shake .3s; }
  #me:empty { display: none; }
  #me { font-size: 1.6rem; font-weight: 900; padding: 6px 22px; border-radius: 999px; border: 3px solid currentColor; }
  /* chữ to giữa màn hình: đếm ngược 3-2-1, GO! */
  #big { position: fixed; inset: 0; z-index: 8; display: flex; align-items: center; justify-content: center; pointer-events: none;
    background: #000a; font-family: Bungee, 'Baloo 2', sans-serif; font-size: min(55vw, 45vh); line-height: 1; color: #ffd43b;
    text-shadow: 0 .06em 0 #e8590c, 0 0 .3em #000; animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
  #big.go { font-size: min(38vw, 30vh); color: #69db7c; text-shadow: 0 .06em 0 #2b8a3e, 0 0 .3em #000; background: none; }
  @keyframes shake { 25% { translate: -10px 0; } 75% { translate: 10px 0; } }
  /* màn chúc mừng khi về đích / hết giờ */
  #win { position: fixed; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; background: #000c; overflow: hidden; text-align: center; animation: fade .3s; }
  #win .medal { font-size: 7rem; line-height: 1; animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) both, bob 1.6s .6s ease-in-out infinite; }
  #win .place { font-size: 4rem; font-weight: 900; animation: pop .6s .15s cubic-bezier(.3, 1.6, .5, 1) both; }
  #win .msg { font-size: 2rem; font-weight: 700; color: #ffd8a8; animation: fade .6s .4s both; }
  #win small { font-size: 1.2rem; color: #fff8; margin-top: 24px; animation: fade 1s 1.5s both; }
  #win i { position: absolute; top: -20px; width: 10px; height: 16px; animation: fall linear infinite; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes pop { from { transform: scale(0) rotate(-20deg); opacity: 0; } }
  @keyframes bob { 50% { transform: translateY(-10px) rotate(6deg); } }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
</style>
</head>
<body>
<div id="join" class="screen">
  <h1><img class="logo" src="/assets/scooter.png" alt=""> Đua Xe Ôm</h1>
  <form id="form">
    <p><input id="name" maxlength="20" placeholder="Tên của bạn" autocomplete="off" required></p>
    <button id="go" disabled>Đang kết nối…</button>
  </form>
</div>
<div id="game" class="screen" hidden>
  <div id="view">
    <div id="hud"><div id="me"></div><div id="rank"></div></div>
    <canvas id="track"></canvas>
    <div id="status">Chờ host bắt đầu…</div>
  </div>
  <button id="tap" class="off"><img src="/assets/scooter.png" alt="" draggable="false"><span id="label">CHỜ…</span></button>
</div>
<div id="big" hidden></div>
<div id="win" hidden>
  <div class="medal"></div><div class="place"></div><div class="msg"></div><small>Chạm để đóng</small>
</div>
<script src="/assets/hurt-animation.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const ws = new WebSocket(location.origin.replace(/^http/, 'ws'));
  let taps = 0, wasStun = false, st = null, shown = 0, celebrated = false, goTimer;
  const ctx = $('track').getContext('2d');
  const sprites = Object.fromEntries(['scooter', 'pothole', 'impact', 'scooter-hurt'].map(n => { const i = new Image(); i.src = `/assets/${n}.png`; return [n, i]; }));
  const hurt = new HurtAnimation();

  $('name').value = localStorage.name || '';
  ws.onopen = () => { $('go').disabled = false; $('go').textContent = 'Vào đua'; };
  ws.onclose = () => { $('status').textContent = 'Mất kết nối, tải lại trang nhé'; $('go').textContent = 'Mất kết nối'; $('go').disabled = true; };

  $('form').onsubmit = e => {
    e.preventDefault();
    const name = $('name').value.trim();
    if (!name || ws.readyState !== 1) return;
    localStorage.name = name;
    ac = new AudioContext(); // tạo trong lúc bấm nút, iOS mới cho phát tiếng
    ws.send(JSON.stringify({ join: name }));
    $('join').hidden = true; $('game').hidden = false;
  };

  $('win').onclick = () => { $('win').hidden = true; };
  // tiếng sập ổ gà: tiếng rè (noise) + tiếng uỵch trầm, cùng kiểu với màn hình lớn
  let ac;
  function crash() {
    if (!ac) return;
    const t = ac.currentTime, buf = ac.createBuffer(1, ac.sampleRate * 0.4, ac.sampleRate);
    buf.getChannelData(0).forEach((_, i, d) => (d[i] = Math.random() * 2 - 1));
    const n = ac.createBufferSource(), f = ac.createBiquadFilter(), o = ac.createOscillator(), g1 = ac.createGain(), g2 = ac.createGain();
    n.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900;
    o.frequency.setValueAtTime(165, t); o.frequency.exponentialRampToValueAtTime(40, t + 0.3);
    g1.gain.setValueAtTime(0.5, t); g1.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    g2.gain.setValueAtTime(0.6, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    n.connect(f).connect(g1).connect(ac.destination); o.connect(g2).connect(ac.destination);
    n.start(t); n.stop(t + 0.4); o.start(t); o.stop(t + 0.3);
  }
  // bíp đếm ngược kiểu F1: 3-2-1 nốt La, GO cao hơn 1 quãng tám
  function beep(f, dur, at = 0, type = 'square') {
    if (!ac) return;
    const t = ac.currentTime + at, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
  }
  $('tap').onpointerdown = e => {
    e.preventDefault();
    if (ac?.state === 'suspended') ac.resume(); // iOS tạm dừng audio khi khoá màn hình/chuyển app
    taps++;
    $('tap').classList.add('hit');
    setTimeout(() => $('tap').classList.remove('hit'), 60);
  };
  setInterval(() => { if (taps && ws.readyState === 1) { ws.send(JSON.stringify({ taps })); taps = 0; } }, 100);

  ws.onmessage = e => {
    const s = JSON.parse(e.data);
    if (s.you) { // nền điện thoại cùng màu với làn của mình trên màn hình lớn
      document.body.style.background = `hsl(${s.hue} 45% 16%)`;
      $('me').style.color = `hsl(${s.hue} 80% 72%)`;
      return;
    }
    if (s.full) { $('status').textContent = `Phòng đã đủ ${s.full} tay đua, chờ ván sau nhé`; $('go').disabled = true; return; }
    if ($('game').hidden) return;
    $('me').textContent = `Làn ${s.lane}`;
    let text;
    if (s.phase === 'lobby') text = `Chờ host bắt đầu… (${s.total} tay đua)`;
    else if (s.phase === 'countdown') text = 'Chuẩn bị…';
    else if (s.place) text = `🏁 Về đích hạng ${s.place}! ${['🥇', '🥈', '🥉'][s.place - 1] || '🎉'}`;
    else if (s.phase === 'race') text = s.stun ? '💥 Sập ổ gà! Chờ chút…' : '👆 TAP liên tục!';
    else text = s.pos ? `Hết giờ! Bạn hạng ${s.rank}/${s.total}` : 'Chờ ván mới…';
    $('status').textContent = text;
    $('rank').innerHTML = s.phase === 'lobby' || s.phase === 'countdown' ? '' : `#${s.rank}<small>/${s.total}</small>`;
    const racing = s.phase === 'race' && !s.place;
    $('tap').classList.toggle('off', !racing);
    $('tap').classList.toggle('stun', racing && s.stun);
    $('label').textContent = !racing ? (s.place ? '🏁 Về đích' : 'CHỜ…') : s.stun ? '💥 SẬP Ổ GÀ!' : 'TAP!';
    // đếm ngược 3-2-1 to giữa màn hình, vào đua thì hiện GO! chừng 1 giây
    if (s.phase === 'countdown') big(s.cd > 0 ? String(Math.ceil(s.cd / 1000)) : 'GO!', s.cd > 0 ? '' : 'go');
    else if (s.phase === 'race' && st?.phase === 'countdown') { big('GO!', 'go'); clearTimeout(goTimer); goTimer = setTimeout(() => big(''), 900); }
    else if (s.phase !== 'race') big('');
    const sec = x => x?.phase === 'countdown' ? Math.ceil(x.cd / 1000) : 0;
    if (sec(s) && sec(s) !== sec(st)) beep(440, 0.4);
    if (s.phase === 'race' && st?.phase === 'countdown') beep(880, 0.9);
    st = s;
    if (s.stun && !wasStun) { crash(); if (navigator.vibrate) navigator.vibrate(200); }
    wasStun = s.stun;

    // về đích hoặc hết giờ: hiện 1 lần mỗi ván, ván mới thì reset
    if (s.phase === 'lobby' || s.phase === 'countdown') { celebrated = false; $('win').hidden = true; }
    else if (!celebrated && (s.place || (s.phase === 'done' && s.pos))) { celebrated = true; celebrate(s); }
  };

  function big(text, cls = '') {
    const b = $('big');
    if (b.textContent === text) return;
    b.textContent = text; b.className = cls; b.hidden = !text;
    b.style.animation = 'none'; b.offsetWidth; b.style.animation = ''; // chạy lại hiệu ứng nảy mỗi số
    if (text && navigator.vibrate) navigator.vibrate(cls === 'go' ? 250 : 60);
  }

  function celebrate(s) {
    const w = $('win'), top = s.place && s.place <= 3;
    w.querySelector('.medal').textContent = s.place ? ['🥇', '🥈', '🥉'][s.place - 1] || '🏁' : '⏱️';
    w.querySelector('.place').textContent = `Hạng ${s.place || s.rank}`;
    w.querySelector('.msg').textContent = s.place === 1 ? 'VÔ ĐỊCH! 🎉' : top ? 'Lên bục rồi! 🎉' : s.place ? 'Về đích! Giỏi lắm 👏' : `Hết giờ! Hạng ${s.rank}/${s.total}`;
    w.querySelectorAll('i').forEach(c => c.remove());
    if (s.place) for (let k = 0; k < (top ? 60 : 25); k++) { // pháo giấy, top 3 nhiều hơn
      const c = document.createElement('i');
      c.style.cssText = `left:${Math.random() * 100}%;background:hsl(${Math.random() * 360} 90% 60%);` +
        `animation-duration:${2 + Math.random() * 2}s;animation-delay:${-Math.random() * 3}s`;
      w.append(c);
    }
    w.hidden = false;
    if (navigator.vibrate) navigator.vibrate(top ? [100, 60, 100, 60, 300] : 150);
    // nhạc chúc mừng: top 3 rải hợp âm Đô trưởng lên cao, về đích thường 2 nốt, hết giờ 2 nốt đi xuống
    const notes = top ? [523, 659, 784, 1047, 784, 1047] : s.place ? [659, 1047] : [392, 330];
    notes.forEach((f, i) => beep(f, i === notes.length - 1 ? 0.8 : 0.25, i * 0.13, 'triangle'));
  };

  function sprite(name, x, y, w, h, frame) {
    const i = sprites[name];
    if (!i.naturalWidth) return;
    const source = frame || { x: 0, y: 0, w: i.naturalWidth, h: i.naturalHeight };
    const k = Math.min(w / source.w, h / source.h);
    ctx.drawImage(i, source.x, source.y, source.w, source.h, x - source.w * k / 2, y - source.h * k / 2, source.w * k, source.h * k);
  }
  // làn của mình: camera bám theo xe (chỉ thấy VIEW mét quanh xe) để ổ gà không dính chùm; trên cùng là thanh tiến độ cả đường
  const VIEW = 70;
  function draw() {
    const c = $('track'), dpr = devicePixelRatio || 1, W = c.clientWidth, H = c.clientHeight;
    if (c.width !== W * dpr || c.height !== H * dpr) { c.width = W * dpr; c.height = H * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);
    if (st) {
      shown += (st.pos - shown) * 0.3;
      if (st.pos < shown) shown = st.pos; // ván mới thì về vạch xuất phát ngay
      const holes = st.phase === 'lobby' ? [] : st.holes || [];

      // thanh tiến độ: vạch đích, ổ gà, chấm xe
      const bx = 14, bw = W - 28, by = 16, P = pos => bx + bw * Math.min(1, pos / st.track);
      ctx.fillStyle = '#fff3'; ctx.beginPath(); ctx.roundRect(bx, by - 5, bw, 10, 5); ctx.fill();
      ctx.fillStyle = '#ffa94d'; ctx.beginPath(); ctx.roundRect(bx, by - 5, P(shown) - bx, 10, 5); ctx.fill();
      ctx.fillStyle = '#111'; holes.forEach(h => { ctx.beginPath(); ctx.arc(P(h), by, 3.5, 0, 7); ctx.fill(); });
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(P(shown), by, 8, 0, 7); ctx.fill();

      // mặt đường kéo đầy phần còn lại, cuộn theo xe
      const top = 34, lane = Math.min(H - top - 8, W * 0.45), y = top + (H - top) / 2, k = W / VIEW;
      const cam = shown - VIEW * 0.3, X = pos => (pos - cam) * k;
      ctx.fillStyle = '#3d3b38'; ctx.fillRect(0, y - lane / 2, W, lane);
      ctx.strokeStyle = '#fff8'; ctx.lineWidth = 3; ctx.setLineDash([18, 14]); ctx.lineDashOffset = cam * k;
      ctx.beginPath(); ctx.moveTo(0, y - lane / 2); ctx.lineTo(W, y - lane / 2); ctx.moveTo(0, y + lane / 2); ctx.lineTo(W, y + lane / 2); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#fff6'; ctx.fillRect(X(0) - 2, y - lane / 2, 4, lane); // vạch xuất phát
      const sq = lane / 8;
      for (let r = 0; r < 8; r++) for (let j = 0; j < 2; j++) { ctx.fillStyle = (r + j) % 2 ? '#fff' : '#111'; ctx.fillRect(X(st.track) + lane * 0.19 + j * sq, y - lane / 2 + r * sq, sq, sq); }
      holes.forEach(h => sprite('pothole', X(h) + lane * 0.19, y + lane * 0.23, lane * 0.5, lane * 0.3)); // khớp bánh trước, như màn hình host
      const frame = hurt.frame(0, st.stun);
      const animated = frame && sprites['scooter-hurt'].complete && sprites['scooter-hurt'].naturalWidth;
      sprite(animated ? 'scooter-hurt' : 'scooter', X(shown), y, lane * 0.9, lane * 0.6, animated ? frame : null);
      if (st.stun) sprite('impact', X(shown), y - lane * 0.3, lane * 0.35, lane * 0.35);
    }
    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
