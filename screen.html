<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moto Taxi Race: screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Bungee&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; background: #2b2a28; color: #fff; font-family: 'Baloo 2', system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  header { position: fixed; top: 0; left: 0; right: 0; height: 110px; display: flex; align-items: center; gap: 24px; padding: 0 24px; }
  h1, #big, #podium { font-family: Bungee, 'Baloo 2', sans-serif; font-weight: 400; }
  header h1 { margin: 0; font-size: 2.4rem; white-space: nowrap; }
  .logo { width: 1.5em; height: 1.15em; object-fit: contain; vertical-align: middle; }
  #status { font-size: 1.6rem; color: #ffd8a8; }
  #qr { position: fixed; background: #fff; color: #111; border-radius: 14px; padding: 10px; text-align: center; font-weight: 700;
    top: 6px; right: 12px; padding: 8px; transition: all .4s; }
  #qrimg { width: 72px; height: 72px; transition: all .4s; }
  #qrimg svg { display: block; width: 100%; height: 100%; }
  #qr span { display: none; }
  /* lobby: QR to nằm trên dòng header (chữ bên trái, mã bên phải), đường đua bên dưới chạy hết chiều ngang */
  body.lobby header { height: 200px; padding-right: 520px; }
  body.lobby #qr { display: flex; flex-direction: row-reverse; align-items: center; gap: 16px; text-align: left; padding: 10px 10px 10px 20px; }
  body.lobby #qrimg { width: 172px; height: 172px; }
  body.lobby #qr span { display: block; font-size: 1.6rem; }
  body.lobby #joinurl { max-width: 260px; }
  #qr { cursor: zoom-in; z-index: 10; }
  /* bấm QR: phóng to toàn màn hình, bấm lại hoặc Esc để thu nhỏ */
  body #qr.full { inset: 0; top: 0; right: 0; transform: none; border-radius: 0; cursor: zoom-out;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0; }
  body #qr.full #qrimg { width: min(85vw, 80vh); height: min(85vw, 80vh); }
  body #qr.full span { display: block; margin-top: 8px; font-size: 2rem; }
  body #qr.full #joinurl { font-size: 1.2rem !important; max-width: 85vw; }
  #joinurl { font-size: .85rem !important; font-weight: 400; color: #555; max-width: 300px; word-break: break-all; }
  #joinurl.warn { color: #c92a2a; font-weight: 700; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-shadow: 0 4px 24px #000; }
  #big { font-size: 12rem; font-weight: 900; }
  #podium { font-size: 3rem; font-weight: 800; line-height: 1.5; background: #000a; padding: 24px 48px; border-radius: 20px; }
  #podium:empty { display: none; }
  #hint { position: fixed; bottom: 12px; left: 24px; color: #999; }
  /* phụ đề bình luận viên */
  #say { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); max-width: 80vw; z-index: 5;
    background: #000c; border: 2px solid #ffd43b; border-radius: 14px; padding: 10px 22px;
    font-size: 1.8rem; font-weight: 800; text-align: center; transition: opacity .4s; pointer-events: none; }
  #say:empty, #say.old { opacity: 0; }
  #say::before { content: '🎙️ '; }
  /* lúc đua: header gọn lại, nhường chỗ cho làn đường */
  body:not(.lobby) header { height: 100px; padding-right: 120px; } /* chừa chỗ QR nhỏ */
  body:not(.lobby) header h1 { font-size: 1.6rem; }
  body.race #hint, body.countdown #hint { display: none; }
  /* top 5 nằm ngang trên header để đường đua dùng hết chiều ngang */
  #top { display: none; flex: 1; gap: 20px; margin: 0; padding: 0; list-style-position: inside;
    font-size: 1.4rem; font-weight: 700; overflow: hidden; }
  body.race #top, body.done #top { display: flex; }
  #top li { color: hsl(var(--h) 80% 72%); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  #top li::marker { color: #fff; }
  #top small { color: #fff8; font-size: 1rem; font-weight: 600; margin-left: 6px; }
</style>
</head>
<body class="lobby">
<canvas id="c"></canvas>
<header><h1><img class="logo" src="/assets/scooter.png" alt=""> MOTO TAXI RACE</h1><div id="status">Connecting…</div><ol id="top"></ol></header>
<div id="qr"><div id="qrimg" role="img" aria-label="Join QR"></div><div><span>Scan to race!</span><span id="joinurl"></span></div></div>
<div id="overlay"><div id="big"></div><div id="podium"></div></div>
<div id="hint"></div>
<div id="say"></div>
<script src="/assets/hurt-animation.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const key = new URLSearchParams(location.search).get('key');
  const ctx = $('c').getContext('2d');
  const sprites = Object.fromEntries(['scooter', 'pothole', 'impact', 'scooter-hurt'].map(name => {
    const image = new Image();
    image.src = `/assets/${name}.png`;
    return [name, image];
  }));
  const hurt = new HurtAnimation();
  const ws = new WebSocket(location.origin.replace(/^http/, 'ws'));
  const shown = new Map(); // id -> vị trí đang vẽ, để xe chạy mượt giữa các lần nhận state
  let state = { phase: 'lobby', players: [], track: 100 };

  // hỏi lại mỗi 5s: bật tunnel sau khi đã mở màn hình thì QR vẫn tự đổi sang link public
  async function refreshQR() {
    try {
      const { url, svg } = await (await fetch('/join')).json();
      if ($('qrimg').dataset.url === url) return;
      $('qrimg').dataset.url = url;
      $('qrimg').innerHTML = svg;
      const local = /\/\/(localhost|127\.|\[::1\])/.test(url);
      $('joinurl').textContent = local ? '⚠️ No tunnel, phones can\'t join. Run: npm run tunnel' : url.replace('https://', '');
      $('joinurl').classList.toggle('warn', local);
    } catch {}
  }
  refreshQR(); setInterval(refreshQR, 5000);
  $('qr').onclick = () => $('qr').classList.toggle('full');
  addEventListener('keydown', e => e.key === 'Escape' && $('qr').classList.remove('full'));
  $('hint').textContent = (key ? 'Space: start / new race' : 'View only: add ?key=… to the URL to control') + ' · M: toggle commentary · N: toggle music';
  ws.onopen = () => ws.send(JSON.stringify({ screen: true }));
  ws.onclose = () => { $('status').textContent = 'Lost connection to server'; };
  let top3 = new Set(); // id 3 người dẫn đầu, để tô sáng làn
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.say) return commentate(d.say, d.urgent, d.lang);
    const prev = state; state = d; sounds(prev, d); updateUI();
  };

  // Nhạc nền + hiệu ứng: tổng hợp bằng Web Audio, không cần file. Trình duyệt chỉ cho phát sau khi bấm phím/chuột.
  const ac = new AudioContext(), out = ac.createGain(), mus = ac.createGain();
  out.connect(ac.destination); mus.connect(out);
  addEventListener('keydown', () => ac.resume()); addEventListener('pointerdown', () => ac.resume());
  const hz = n => 220 * 2 ** (n / 12); // n = số bán cung tính từ nốt La 220Hz
  function tone(dest, n, t, dur, type, vol, slide) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(hz(n), t);
    if (slide != null) o.frequency.exponentialRampToValueAtTime(hz(slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(dest); o.start(t); o.stop(t + dur);
  }
  const noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  noiseBuf.getChannelData(0).forEach((_, i, d) => (d[i] = Math.random() * 2 - 1));
  function noise(dest, t, dur, vol, freq) {
    const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    s.buffer = noiseBuf; f.type = freq > 3000 ? 'highpass' : 'lowpass'; f.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    s.connect(f).connect(g).connect(dest); s.start(t); s.stop(t + dur);
  }

  // mỗi ô = 1 nốt móc kép, 16 ô/ô nhịp, hợp âm Am-F-C-G
  const CHORDS = [[0, 3, 7], [-4, 0, 3], [3, 7, 10], [-2, 2, 5]];
  const chill = { bpm: 96, step(s, t, c) {
    if (s % 4 === 0) tone(mus, c[0] - 12, t, 0.5, 'triangle', 0.15);
    if (s % 2 === 0) tone(mus, c[s / 2 % 3] + 12, t, 0.3, 'triangle', 0.05);
  } };
  const MUSIC = { lobby: chill, done: chill, race: { bpm: 150, step(s, t, c) {
    if (s % 4 === 0) tone(mus, -12, t, 0.2, 'sine', 0.35, -36); // trống kick
    if (s % 2) noise(mus, t, 0.04, 0.06, 7000); else tone(mus, c[0] - 12, t, 0.12, 'square', 0.06);
    tone(mus, c[s % 3] + (s % 8 > 3 ? 24 : 12), t, 0.1, 'square', 0.025);
  } } };
  let music, step = 0, nextT = 0;
  function setMusic(phase, delay = 0.05) { music = MUSIC[phase]; step = 0; nextT = ac.currentTime + delay; }
  setMusic('lobby');
  setInterval(() => {
    mus.gain.setTargetAtTime(window.speechSynthesis?.speaking ? 0.3 : 0.7, ac.currentTime, 0.1); // nhỏ nhạc khi bình luận viên nói
    if (!music || ac.state !== 'running') return;
    nextT = Math.max(nextT, ac.currentTime); // tab bị treo thì bắt nhịp lại, không dồn nốt
    for (; nextT < ac.currentTime + 0.12; nextT += 15 / music.bpm, step++) music.step(step % 16, nextT, CHORDS[(step >> 4) % 4]);
  }, 25);

  const honk = t => [0, 0.2].forEach(d => [10, 14].forEach(n => tone(out, n, t + d, 0.15, 'sawtooth', 0.08)));
  let lastStun = 0;
  const SFX = {
    join: t => { tone(out, 12, t, 0.08, 'square', 0.08); tone(out, 19, t + 0.08, 0.15, 'square', 0.08); },
    // kiểu đèn xuất phát F1: tiếng bíp + tiếng nẹt pô gầm dần lên mỗi nhịp (k = 1, 2, 3)
    beep: (t, k) => { tone(out, 0, t, 0.4, 'square', 0.1); tone(out, -24 + k * 3, t, 0.7, 'sawtooth', 0.12, -14 + k * 4); noise(out, t, 0.5, 0.2, 300); },
    go: t => { tone(out, 12, t, 0.9, 'square', 0.12); tone(out, -20, t, 1.4, 'sawtooth', 0.18, 2); noise(out, t, 1, 0.3, 500); honk(t + 0.3); },
    stun: t => { if (t - lastStun < 0.15) return; lastStun = t; noise(out, t, 0.35, 0.4, 900); tone(out, -5, t, 0.3, 'sine', 0.4, -30); },
    finish: (t, place) => (place <= 3 ? [15, 19, 22, 27] : [22]).forEach((n, i) => tone(out, n, t + i * 0.09, 0.35, 'triangle', 0.15)),
    fanfare: t => [[3, .15], [7, .15], [10, .15], [15, .5], [10, .15], [15, .9]].reduce((at, [n, d]) =>
      (tone(out, n, at, d + 0.1, 'square', 0.08), tone(out, n - 12, at, d + 0.1, 'triangle', 0.12), at + d), t),
    // khán giả vỗ tay: ~150 tiếng "bộp" ngẫu nhiên trong 4 giây, nhỏ dần
    applause: t => { for (let i = 0; i < 150; i++) { const d = Math.random() * 4; noise(out, t + d, 0.04, 0.12 * (1 - d / 5), 1500 + Math.random() * 2500); } },
  };
  function sounds(a, b) {
    if (!('cd' in a)) return setMusic(b.phase); // state đầu tiên: chỉ chọn nhạc, không phát hiệu ứng
    const t = ac.currentTime;
    if (a.phase !== b.phase) {
      setMusic(b.phase, b.phase === 'done' ? 2.2 : 0.05); // countdown không có nhạc; done chờ kèn xong mới vào nhạc
      if (b.phase === 'race') SFX.go(t);
      if (b.phase === 'done') { SFX.fanfare(t); SFX.applause(t + 0.6); }
    }
    if (b.phase === 'countdown' && b.cd > 0 && Math.ceil(b.cd / 1000) !== Math.ceil(a.cd / 1000)) SFX.beep(t, 4 - Math.ceil(b.cd / 1000));
    const old = new Map(a.players.map(p => [p.id, p]));
    for (const p of b.players) {
      const o = old.get(p.id);
      if (!o) { if (b.phase === 'lobby') SFX.join(t); }
      else if (p.place && !o.place) SFX.finish(t, p.place);
      else if (p.stun && !o.stun) SFX.stun(t);
    }
  }
  let soundOn = true;
  addEventListener('keydown', e => {
    if (e.key.toLowerCase() !== 'n') return;
    soundOn = !soundOn; out.gain.value = +soundOn;
    commentate(soundOn ? 'Music on' : 'Music off');
  });

  // Bình luận viên: hiện phụ đề + đọc bằng giọng có sẵn của trình duyệt (vi hoặc en). Phím M bật/tắt tiếng.
  let muted = false, sayTimer;
  // macOS có cả giọng 'vui' (Albert, Bad News…) đứng đầu danh sách tiếng Anh, nên ưu tiên giọng chuẩn
  const voiceFor = lang => {
    const vs = speechSynthesis.getVoices().filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(lang));
    return vs.find(v => /Samantha|Google US English|Daniel|Karen|Linh/.test(v.name)) || vs[0];
  };
  function commentate(text, urgent, lang = 'en') {
    $('say').textContent = text; $('say').classList.remove('old');
    clearTimeout(sayTimer); sayTimer = setTimeout(() => $('say').classList.add('old'), 1500 + text.length * 70);
    if (muted || !('speechSynthesis' in window)) return;
    if (urgent) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'en' ? 'en-US' : 'vi-VN'; u.voice = voiceFor(lang) || null; u.rate = 1.15; u.pitch = 1.1;
    speechSynthesis.speak(u);
  }
  addEventListener('keydown', e => {
    if (e.key.toLowerCase() !== 'm') return;
    muted = !muted; if (muted) speechSynthesis.cancel();
    commentate(muted ? 'Commentary muted' : 'Commentary on');
  });
  addEventListener('keydown', e => {
    if (e.code === 'Space' && key && ws.readyState === 1) ws.send(JSON.stringify({ start: key }));
  });

  function updateUI() {
    const n = state.players.length;
    document.body.className = state.phase;
    $('status').textContent = {
      lobby: `Scan the QR to join · ${n} racer${n === 1 ? '' : 's'}`,
      countdown: 'Get ready…',
      race: 'TAP! TAP! TAP!',
      done: 'Finished!',
    }[state.phase];
    $('big').textContent = state.phase === 'countdown' ? Math.ceil(state.cd / 1000) || 'GO!' : '';
    $('podium').innerHTML = state.phase !== 'done' ? '' : state.players
      .filter(p => p.place).sort((a, b) => a.place - b.place).slice(0, 3)
      .map(p => `${['🥇', '🥈', '🥉'][p.place - 1]} ${esc(p.name)}`).join('<br>') || 'Nobody finished 😅';

    // giữ làn cố định theo thứ tự vào phòng, chỉ bảng top 5 là xếp theo hạng
    state.players.forEach((p, i) => (p.lane = i + 1));
    const ranked = state.players.filter(p => p.pos > 0)
      .sort((a, b) => (a.place || 1e9) - (b.place || 1e9) || b.pos - a.pos);
    top3 = new Set(ranked.slice(0, 3).map(p => p.id));
    $('top').innerHTML = ranked.slice(0, 5)
      .map(p => `<li style="--h:${p.hue}">${esc(p.name)}<small>lane ${p.lane}</small></li>`).join('');
  }
  const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);

  function emoji(ch, x, y, size, flip) {
    ctx.save();
    ctx.translate(x, y);
    if (flip) ctx.scale(-1, 1); // emoji 🛵 của Apple quay đầu sang trái
    ctx.font = `${size}px serif`;
    ctx.fillStyle = '#000'; // emoji màu vẫn ăn alpha của fillStyle, phải đặt màu đặc
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(ch, 0, 0);
    ctx.restore();
  }

  function sprite(name, x, y, width, height, fallback, frame) {
    const image = sprites[name];
    if (!image.complete || !image.naturalWidth) return emoji(fallback, x, y, height, name === 'scooter');
    const source = frame || { x: 0, y: 0, w: image.naturalWidth, h: image.naturalHeight };
    const scale = Math.min(width / source.w, height / source.h);
    const w = source.w * scale, h = source.h * scale;
    ctx.drawImage(image, source.x, source.y, source.w, source.h, x - w / 2, y - h / 2, w, h);
  }

  function draw() {
    const dpr = devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    if ($('c').width !== W * dpr || $('c').height !== H * dpr) { $('c').width = W * dpr; $('c').height = H * dpr; }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, W, H);

    const ps = state.players, n = Math.max(ps.length, 1);
    const lobby = state.phase === 'lobby';
    const top = lobby ? 210 : 100, lane = Math.min(110, (H - top - (lobby ? 40 : 10)) / n);
    const x0 = 200, roadR = W, x1 = roadR - 50; // đường chạy hết chiều ngang, QR nằm trên header
    const X = pos => x0 + (x1 - x0) * pos / state.track;

    // mặt đường
    ctx.fillStyle = '#3d3b38';
    ctx.fillRect(0, top, roadR, lane * n);
    ctx.fillStyle = '#0003'; ctx.fillRect(0, top, x0 - 45, lane * n); // cột tên
    if (!ps.length) {
      ctx.font = `800 28px 'Baloo 2', system-ui`; ctx.fillStyle = '#fff8'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('Waiting for the first racer… scan the QR to join!', (x0 + x1) / 2, top + lane / 2);
    }
    // vạch đích caro
    const sq = 10;
    for (let y = top, r = 0; y < top + lane * n; y += sq, r++)
      for (let c = 0; c < 3; c++) { ctx.fillStyle = (r + c) % 2 ? '#fff' : '#111'; ctx.fillRect(x1 + c * sq, y, sq, sq); }

    ps.forEach((p, i) => {
      const y = top + lane * i + lane / 2;
      const cur = shown.has(p.id) ? shown.get(p.id) : p.pos;
      const x = cur + (p.pos - cur) * 0.3;
      shown.set(p.id, x);

      // nền làn theo màu người chơi (khớp màu nền điện thoại), top 3 sáng hơn + viền vàng
      const lead = top3.has(p.id) && !lobby;
      ctx.fillStyle = `hsl(${p.hue} 70% 50% / ${lead ? 0.35 : 0.13})`;
      ctx.fillRect(0, top + lane * i, roadR, lane);
      if (lead) { ctx.strokeStyle = '#ffd43b'; ctx.lineWidth = 2; ctx.strokeRect(1, top + lane * i + 1, roadR - 2, lane - 2); }

      if (i > 0) {
        ctx.strokeStyle = '#ffffff33'; ctx.lineWidth = 1; ctx.setLineDash([16, 12]);
        ctx.beginPath(); ctx.moveTo(0, top + lane * i); ctx.lineTo(roadR, top + lane * i); ctx.stroke();
        ctx.setLineDash([]);
      }
      // server tính sập ổ gà khi tâm xe chạm h → lệch ổ gà tới bánh trước, hạ xuống mặt đường (sprite xe cao 0.7 làn)
      if (state.phase !== 'lobby') p.holes.forEach(h => sprite('pothole', X(h) + lane * 0.22, y + lane * 0.27, lane * 0.6, lane * 0.3, '🕳️'));
      const frame = hurt.frame(p.id, p.stun);
      const animated = frame && sprites['scooter-hurt'].complete && sprites['scooter-hurt'].naturalWidth;
      sprite(animated ? 'scooter-hurt' : 'scooter', X(x), y, lane * 1.1, lane * 0.7, '🛵', animated ? frame : null);
      if (p.stun) sprite('impact', X(x), y - lane * 0.35, lane * 0.4, lane * 0.4, '💥');
      if (p.place) emoji(['🥇', '🥈', '🥉'][p.place - 1] || '🏁', X(x) + lane * 0.6, y, lane * 0.5);

      // số làn ở mép trái; làn hẹp thì tên chạy theo sau xe để khỏi phải dò cả hàng
      ctx.font = `800 ${Math.max(14, Math.min(22, lane * 0.5))}px 'Baloo 2', system-ui`;
      ctx.textBaseline = 'middle'; ctx.lineWidth = 3; ctx.strokeStyle = '#000';
      ctx.fillStyle = `hsl(${p.hue} 80% 72%)`;
      ctx.textAlign = 'left'; ctx.fillText(i + 1, 12, y);
      const nx = lane < 36 ? X(x) - lane * 0.6 : x0 - 50; // sprite xe rộng 1.1 làn
      ctx.textAlign = 'right';
      ctx.strokeText(p.name, nx, y, nx - 50);
      ctx.fillText(p.name, nx, y, nx - 50);
    });
    for (const id of shown.keys()) if (!ps.some(p => p.id === id)) { shown.delete(id); hurt.started.delete(id); }

    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
